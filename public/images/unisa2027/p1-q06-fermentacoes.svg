<path d="M145 439h43v32h-43z" fill="#f7f6f2"/>
<path d="M188 439l18-9v32l-18 9z" fill="#eee9eb"/>
<path d="M145 472h43v20h-43z" fill="#ee9fc2"/>
</g>
<text x="166.5" y="459" text-anchor="middle" font-size="13.5" font-weight="600">Iogurte</text>

<!-- Cream cheese -->
<path d="M215 432h83l-9 61h-64z" fill="url(#tub)" stroke="#657174" stroke-width="1.15"/>
<rect x="207" y="419" width="98" height="14" rx="2" fill="#147cac" stroke="#53656c" stroke-width="1.1"/>
<path d="M211 422h90" stroke="#68b5d4" stroke-width="2"/>
<text x="256" y="458" text-anchor="middle" font-size="16">Cream</text>
<text x="256" y="478" text-anchor="middle" font-size="16">cheese</text>

<!-- Taça de vinho -->
<path d="M352 427h23c0 17-4 27-11.5 27s-11.5-10-11.5-27z" fill="url(#glass)" stroke="#777c7b" stroke-width="1"/>
<path d="M354 438h19c-.7 10-3.7 14-9.5 14s-8.8-4-9.5-14z" fill="url(#wine)"/>
<path d="M352 427h23M354 438h19" stroke="#8a8e8c" stroke-width="1"/>
<path d="M363.5 454v39" stroke="#858a88" stroke-width="2"/>
<ellipse cx="363.5" cy="499" rx="12" ry="3" fill="url(#glass)" stroke="#858a88" stroke-width="1"/>

