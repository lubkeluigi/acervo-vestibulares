<rect x="379" y="407" width="26" height="96" fill="url(#wine)" clip-path="url(#bottleClip)"/>
<path d="M387 374h10v31c0 7 7 12 7 21v73q-12 8-24 0v-73c0-9 7-14 7-21z" fill="none" stroke="#777c7b" stroke-width="1.1"/>
