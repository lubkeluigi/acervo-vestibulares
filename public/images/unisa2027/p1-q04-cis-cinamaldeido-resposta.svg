<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" role="img" aria-labelledby="title desc">
  <title id="title">Fórmula estrutural do cis-cinamaldeído</title>
  <desc id="desc">O grupo fenila e o grupo aldeído estão do mesmo lado da ligação dupla carbono-carbono, caracterizando o isômero cis ou Z.</desc>
  <g fill="none" stroke="#25352f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="135,60 112.5,21 67.5,21 45,60 67.5,99 112.5,99"/>
    <line x1="125" y1="60" x2="107" y2="31"/>
    <line x1="67" y1="31" x2="52" y2="60"/>
    <line x1="72" y1="89" x2="108" y2="89"/>
    <line x1="135" y1="60" x2="185" y2="110"/>
    <line x1="185" y1="106" x2="265" y2="106"/>
    <line x1="185" y1="114" x2="265" y2="114"/>
    <line x1="265" y1="110" x2="315" y2="60"/>
    <line x1="311" y1="60" x2="311" y2="27"/>
    <line x1="319" y1="60" x2="319" y2="27"/>
    <line x1="315" y1="60" x2="355" y2="60"/>
    <line x1="185" y1="110" x2="165" y2="150"/>
    <line x1="265" y1="110" x2="285" y2="150"/>
  </g>
  <g fill="#25352f" font-family="Arial, sans-serif" font-size="20">
    <text x="315" y="20" text-anchor="middle">O</text>
    <text x="367" y="66">H</text>
    <text x="151" y="166">H</text>
    <text x="286" y="166">H</text>
  </g>
  <text x="230" y="204" text-anchor="middle" fill="#41564c" font-family="Arial, sans-serif" font-size="17">cis-cinamaldeído (Z)</text>
</svg>
