<title id="titulo">A contagem bacteriana cai até o quarto dia e volta a crescer a partir do quinto; a dose de antibiótico necessária sobe ao sexto dia e permanece elevada.</title>
<desc id="descricao">Redesenho vetorial fiel ao caderno FAMEMA 2022, organizado em setores editáveis.</desc>
