<svg xmlns="http://www.w3.org/2000/svg" width="780" height="505" viewBox="0 0 780 505" role="img" aria-labelledby="titulo descricao">
<title id="titulo">População brasileira por faixa etária, com números absolutos e percentuais para 1980 e 2010 e projeção para 2040, incluindo variação proporcional.</title>
<desc id="descricao">Redesenho vetorial fiel ao caderno FAMEMA 2022, organizado em setores editáveis.</desc>
<style>
