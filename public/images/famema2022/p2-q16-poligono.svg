<svg xmlns="http://www.w3.org/2000/svg" width="300" height="265" viewBox="0 0 300 265" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Quadrado ABCD de lado 1 com E em DA, F em AB, G em BC e H em CD; o quadrilátero EFGH está sombreado.</title>
<desc id="descricao">Redesenho vetorial fiel ao caderno FAMEMA 2022, organizado em setores editáveis.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #17211d; }
  .linha { fill: none; stroke: #26332d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fina { fill: none; stroke: #53615a; stroke-width: 1.25; }
  .rotulo { font-size: 18px; }
  .pequeno { font-size: 14px; }
</style>

<g id="quadrado-abcd">
  <rect x="55" y="35" width="190" height="190" fill="#fff" stroke="#26332d" stroke-width="2"/>
</g>
<g id="poligono-efgh">
  <path d="M55 177.5 L102.5 225 L245 130 L150 35 Z" fill="#dfe5e1" stroke="#26332d" stroke-width="2" stroke-linejoin="round"/>
</g>
<g id="vertices" fill="#26332d">
  <circle cx="55" cy="225" r="3"/><circle cx="245" cy="225" r="3"/>
  <circle cx="245" cy="35" r="3"/><circle cx="55" cy="35" r="3"/>
  <circle cx="55" cy="177.5" r="3"/><circle cx="102.5" cy="225" r="3"/>
  <circle cx="245" cy="130" r="3"/><circle cx="150" cy="35" r="3"/>
</g>
<g id="rotulos-dos-pontos" class="rotulo" font-size="18">
  <text x="39" y="244">A</text><text x="250" y="244">B</text>
  <text x="250" y="31">C</text><text x="38" y="31">D</text>
  <text x="34" y="181">E</text><text x="98" y="247">F</text>
  <text x="252" y="135">G</text><text x="145" y="25">H</text>
</g>
</svg>